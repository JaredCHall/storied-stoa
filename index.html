<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storied Stoa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Cormorant+SC:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #e9e2d3;
            --ink-bright: #f5edd8;
            --ink-dim: #a89e8c;
            --gold: #c9a24b;
            --rule: rgba(201, 162, 75, 0.25);
            --rule-strong: rgba(201, 162, 75, 0.55);
            --measure: 46rem;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* Warm Theban glow above, deep Nantucket water below. */
        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background:
                    radial-gradient(ellipse 60% 50% at 15% 0%, rgba(90, 65, 40, 0.30), transparent 70%),
                    radial-gradient(ellipse 60% 50% at 85% 100%, rgba(20, 45, 80, 0.45), transparent 70%),
                    #121212;
            background-attachment: fixed;
            color: var(--ink);
            font-family: "Cormorant Garamond", Georgia, serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .content {
            flex: 1;
            width: 100%;
            max-width: var(--measure);
            margin: 0 auto;
            padding: 6rem 1.5rem 4rem;
        }

        /* ---------- Masthead ---------- */

        .masthead {
            text-align: center;
            margin-bottom: 4.5rem;
        }

        .masthead h1 {
            font-family: "Cormorant SC", Georgia, serif;
            font-weight: 500;
            font-size: clamp(2.75rem, 8vw, 4.2rem);
            letter-spacing: 0.06em;
            line-height: 1.1;
            color: var(--ink-bright);
            text-shadow: 0 2px 24px rgba(0, 0, 0, 0.8);
        }

        .rule {
            width: 140px;
            height: 1px;
            margin: 1.5rem auto;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
        }

        .subtitle {
            font-style: italic;
            font-size: 1.4rem;
            letter-spacing: 0.03em;
            color: var(--ink-dim);
        }

        /* ---------- Section label, flanked by hairlines ---------- */

        .section-label {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            margin-bottom: 2rem;
            font-family: "Cormorant SC", Georgia, serif;
            font-weight: 600;
            font-size: 1.15rem;
            letter-spacing: 0.16em;
            color: var(--gold);
        }

        .section-label::before,
        .section-label::after {
            content: "";
            flex: 1;
            min-width: 1.5rem;
            height: 2px;
        }

        .section-label::before { background: linear-gradient(to right, transparent, var(--rule-strong)); }
        .section-label::after  { background: linear-gradient(to left,  transparent, var(--rule-strong)); }

        /* ---------- Murals ---------- */

        /* auto-fill: two across at this measure, more rows as murals arrive. */
        .murals {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 18rem), 1fr));
            gap: 1.5rem;
        }

        .mural {
            display: block;
            height: 100%;
            padding: 2.25rem 1.75rem;
            text-align: center;
            text-decoration: none;
            color: inherit;
            background: var(--tint);
            border: 1px solid var(--rule);
            transition: border-color 0.3s ease, transform 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .mural:hover {
            border-color: var(--rule-strong);
            transform: translateY(-2px);
        }

        .mural:focus-visible {
            outline: 1px solid var(--gold);
            outline-offset: 4px;
        }

        .mural-accent {
            width: 2.5rem;
            height: 2px;
            margin: 0 auto 1.25rem;
            background: var(--accent);
        }

        .mural-title {
            font-size: 2rem;
            line-height: 1.15;
            margin-bottom: 0.75rem;
            color: var(--ink-bright);
            transition: color 0.3s ease;
        }

        .mural:hover .mural-title,
        .mural:focus-visible .mural-title {
            color: var(--gold);
        }

        .mural-author {
            font-style: italic;
            font-size: 1.15rem;
            color: var(--ink-dim);
        }

        /* Each card borrows its mural's own palette and title face. */
        .mural--antigone {
            --tint: rgba(23, 20, 15, 0.75);
            --accent: #b14450;
        }
        .mural--antigone .mural-title {
            font-style: italic;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .mural--moby-dick {
            --tint: rgba(11, 26, 46, 0.75);
            --accent: #8a7a5a;
        }
        .mural--moby-dick .mural-title {
            font-family: "Cormorant SC", Georgia, serif;
            font-weight: 500;
            letter-spacing: 0.06em;
        }

        /* ---------- Footer ---------- */

        .page-footer {
            padding: 2rem 1.5rem 3rem;
            text-align: center;
            font-style: italic;
            font-size: 1rem;
            letter-spacing: 0.04em;
            color: var(--ink-dim);
            opacity: 0.6;
        }

        /* ---------- Responsive / motion ---------- */

        @media (max-width: 40rem) {
            .content { padding: 3.5rem 1rem 3rem; }
            .masthead { margin-bottom: 3rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .mural, .mural-title { transition: none; }
            .mural:hover { transform: none; }
        }
    </style>
</head>
<body>

<div class="content">
    <header class="masthead">
        <h1>Storied Stoa</h1>
        <div class="rule"></div>
        <p class="subtitle">A library of murals</p>
    </header>

    <main>
        <h2 class="section-label">The Murals</h2>

        <ul class="murals">
            <li>
                <a class="mural mural--antigone" href="antigone/index.html">
                    <div class="mural-accent"></div>
                    <h3 class="mural-title">Antigone</h3>
                    <p class="mural-author">Sophocles, c. 441 BC</p>
                </a>
            </li>
            <li>
                <a class="mural mural--moby-dick" href="moby-dick/index.html">
                    <div class="mural-accent"></div>
                    <h3 class="mural-title">Moby-Dick</h3>
                    <p class="mural-author">Herman Melville, 1851</p>
                </a>
            </li>
        </ul>
    </main>
</div>

<footer class="page-footer">
    <p>More murals forthcoming.</p>
</footer>

</body>
</html>
