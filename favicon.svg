<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Storied Stoa favicon: colonnade. Drawn on a 16-unit grid so edges land on whole pixels. -->
  <rect width="16" height="16" rx="3" fill="#10284a"/>
  <g fill="#f2ede3">
    <rect x="1" y="2" width="14" height="1"/>   <!-- cornice -->
    <rect x="2" y="3" width="12" height="2"/>   <!-- entablature -->
    <rect x="3" y="5" width="1" height="7"/>    <!-- columns -->
    <rect x="6" y="5" width="1" height="7"/>
    <rect x="9" y="5" width="1" height="7"/>
    <rect x="12" y="5" width="1" height="7"/>
    <rect x="2" y="12" width="12" height="1"/>  <!-- stylobate -->
    <rect x="1" y="13" width="14" height="1"/>  <!-- step -->
  </g>
</svg>